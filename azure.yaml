# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

infra:
    provider: microsoft.foundry
name: foundry-closed-loop-agent
requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
services:
    ai-project:
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
        host: azure.ai.project
    refund-release-loop:
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        description: Refund agent with sandboxed tools, optimized via Foundry Agent Optimizer and released through an eval-gated CI pipeline.
        displayName: Contoso Refund Agent (closed-loop eval demo)
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            OPTIMIZATION_LOCAL_DIR: .agent_configs
            PYTHONNOUSERSITE: "1"
        host: azure.ai.agent
        kind: hosted
        language: python
        name: refund-release-loop
        project: src/refund-agent
        protocols:
            - protocol: responses
              version: 2.0.0
        uses:
            - ai-project
    refund-release-loop-evals:
        $ref: ./evals/azure.eval.yaml
        host: azure.ai.eval
        uses:
            - ai-project
            - refund-release-loop
